services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anhhoa_test
      POSTGRES_USER: anhhoa_test
      POSTGRES_PASSWORD: anhhoa_test
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anhhoa_test -d anhhoa_test']
      interval: 2s
      timeout: 3s
      retries: 15
