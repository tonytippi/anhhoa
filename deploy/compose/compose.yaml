services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    working_dir: /app/apps/api
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build: { context: ../.., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      SUPERADMIN_EMAIL: "${SUPERADMIN_EMAIL:?SUPERADMIN_EMAIL is required}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}"
      OAUTH_STATE_TTL_SECONDS: "${OAUTH_STATE_TTL_SECONDS:?OAUTH_STATE_TTL_SECONDS is required}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:?SESSION_TTL_SECONDS is required}"
      APP_WEB_ORIGIN: "${APP_WEB_ORIGIN:?APP_WEB_ORIGIN is required}"
      APP_GOOGLE_CALLBACK_URL: "${APP_GOOGLE_CALLBACK_URL:?APP_GOOGLE_CALLBACK_URL is required}"
      APP_OAUTH_REDIRECT_URLS: "${APP_OAUTH_REDIRECT_URLS:?APP_OAUTH_REDIRECT_URLS is required}"
      APP_OAUTH_DENIED_REDIRECT_URL: "${APP_OAUTH_DENIED_REDIRECT_URL:?APP_OAUTH_DENIED_REDIRECT_URL is required}"
      APP_SESSION_COOKIE_NAME: "${APP_SESSION_COOKIE_NAME:?APP_SESSION_COOKIE_NAME is required}"
      APP_CSRF_COOKIE_NAME: "${APP_CSRF_COOKIE_NAME:?APP_CSRF_COOKIE_NAME is required}"
      TEACHER_WEB_ORIGIN: "${TEACHER_WEB_ORIGIN:?TEACHER_WEB_ORIGIN is required}"
      TEACHER_GOOGLE_CALLBACK_URL: "${TEACHER_GOOGLE_CALLBACK_URL:?TEACHER_GOOGLE_CALLBACK_URL is required}"
      TEACHER_OAUTH_REDIRECT_URLS: "${TEACHER_OAUTH_REDIRECT_URLS:?TEACHER_OAUTH_REDIRECT_URLS is required}"
      TEACHER_OAUTH_DENIED_REDIRECT_URL: "${TEACHER_OAUTH_DENIED_REDIRECT_URL:?TEACHER_OAUTH_DENIED_REDIRECT_URL is required}"
      TEACHER_SESSION_COOKIE_NAME: "${TEACHER_SESSION_COOKIE_NAME:?TEACHER_SESSION_COOKIE_NAME is required}"
      TEACHER_CSRF_COOKIE_NAME: "${TEACHER_CSRF_COOKIE_NAME:?TEACHER_CSRF_COOKIE_NAME is required}"
      PARENT_WEB_ORIGIN: "${PARENT_WEB_ORIGIN:?PARENT_WEB_ORIGIN is required}"
      PARENT_GOOGLE_CALLBACK_URL: "${PARENT_GOOGLE_CALLBACK_URL:?PARENT_GOOGLE_CALLBACK_URL is required}"
      PARENT_OAUTH_REDIRECT_URLS: "${PARENT_OAUTH_REDIRECT_URLS:?PARENT_OAUTH_REDIRECT_URLS is required}"
      PARENT_OAUTH_DENIED_REDIRECT_URL: "${PARENT_OAUTH_DENIED_REDIRECT_URL:?PARENT_OAUTH_DENIED_REDIRECT_URL is required}"
      PARENT_SESSION_COOKIE_NAME: "${PARENT_SESSION_COOKIE_NAME:?PARENT_SESSION_COOKIE_NAME is required}"
      PARENT_CSRF_COOKIE_NAME: "${PARENT_CSRF_COOKIE_NAME:?PARENT_CSRF_COOKIE_NAME is required}"
      OPS_WEB_ORIGIN: "${OPS_WEB_ORIGIN:?OPS_WEB_ORIGIN is required}"
      OPS_GOOGLE_CALLBACK_URL: "${OPS_GOOGLE_CALLBACK_URL:?OPS_GOOGLE_CALLBACK_URL is required}"
      OPS_OAUTH_REDIRECT_URLS: "${OPS_OAUTH_REDIRECT_URLS:?OPS_OAUTH_REDIRECT_URLS is required}"
      OPS_OAUTH_DENIED_REDIRECT_URL: "${OPS_OAUTH_DENIED_REDIRECT_URL:?OPS_OAUTH_DENIED_REDIRECT_URL is required}"
      OPS_SESSION_COOKIE_NAME: "${OPS_SESSION_COOKIE_NAME:?OPS_SESSION_COOKIE_NAME is required}"
      OPS_CSRF_COOKIE_NAME: "${OPS_CSRF_COOKIE_NAME:?OPS_CSRF_COOKIE_NAME is required}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(\"http\").get(\"http://127.0.0.1:3000/health\", r => process.exit(r.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))"']
      interval: 5s
      timeout: 3s
      retries: 12

  admin:
    build: { context: ../.., dockerfile: apps/web/Dockerfile, args: { VITE_API_URL: https://api.passionedu.org } }
    healthcheck: &portal-healthcheck
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 5s
      timeout: 3s
      retries: 12
  teacher:
    build: { context: ../.., dockerfile: deploy/compose/portal.Dockerfile, args: { APP: teacher-web, VITE_API_URL: https://api.passionedu.org } }
    healthcheck: *portal-healthcheck
  parent:
    build: { context: ../.., dockerfile: apps/parent-web/Dockerfile, args: { VITE_API_URL: https://api.passionedu.org } }
    healthcheck: *portal-healthcheck
  ops:
    build: { context: ../.., dockerfile: deploy/compose/portal.Dockerfile, args: { APP: ops-web, VITE_API_URL: https://api.passionedu.org } }
    healthcheck: *portal-healthcheck

  proxy:
    image: caddy:2.8-alpine
    environment:
      TLS_CERT_FILE: ${TLS_CERT_FILE:?TLS_CERT_FILE is required}
      TLS_KEY_FILE: ${TLS_KEY_FILE:?TLS_KEY_FILE is required}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR is required}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      admin: { condition: service_healthy }
      teacher: { condition: service_healthy }
      parent: { condition: service_healthy }
      ops: { condition: service_healthy }
      api: { condition: service_healthy }

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
