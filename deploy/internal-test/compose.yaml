# Môi trường internal test: PostgreSQL trong Docker + seed PeakLand, expose qua Cloudflare Tunnel.
# Mỗi portal proxy /api về API cùng origin (xem nginx.conf). Port chỉ bind 127.0.0.1 dải 9000.
name: passionedu-internal

x-api-build: &api-build
  context: ../..
  dockerfile: apps/api/Dockerfile

x-portal-healthcheck: &portal-healthcheck
  test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/']
  interval: 5s
  timeout: 3s
  retries: 12

x-database-url: &database-url "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ['127.0.0.1:${POSTGRES_PORT:-9005}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build: *api-build
    working_dir: /app/apps/api
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # One-off: docker compose --profile seed run --rm seed
  # Seed PeakLand dùng source + tsx (stage build) và CSV trong docs/peakland; seed chỉ chạy với NODE_ENV=development.
  seed:
    profiles: [seed]
    build: { <<: *api-build, target: build }
    working_dir: /app/apps/api
    command: ['pnpm', 'exec', 'prisma', 'db', 'seed']
    environment:
      NODE_ENV: development
      PRISMA_SEED: 'true'
      DATABASE_URL: *database-url
    volumes: ['../../docs/peakland:/app/docs/peakland:ro']
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'

  api:
    build: *api-build
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: *database-url
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?SUPERADMIN_EMAIL is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS:-600}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      BANK_DEEP_LINK_CONFIG: ${BANK_DEEP_LINK_CONFIG:-}
      APP_WEB_ORIGIN: https://${APP_HOST}
      APP_GOOGLE_CALLBACK_URL: https://${APP_HOST}/api/app/auth/google/callback
      APP_OAUTH_REDIRECT_URLS: https://${APP_HOST}
      APP_OAUTH_DENIED_REDIRECT_URL: https://${APP_HOST}
      APP_SESSION_COOKIE_NAME: ${APP_SESSION_COOKIE_NAME:-app_session}
      APP_CSRF_COOKIE_NAME: ${APP_CSRF_COOKIE_NAME:-app_csrf}
      TEACHER_WEB_ORIGIN: https://${TEACHER_HOST}
      TEACHER_GOOGLE_CALLBACK_URL: https://${TEACHER_HOST}/api/teacher/auth/google/callback
      TEACHER_OAUTH_REDIRECT_URLS: https://${TEACHER_HOST}
      TEACHER_OAUTH_DENIED_REDIRECT_URL: https://${TEACHER_HOST}
      TEACHER_SESSION_COOKIE_NAME: ${TEACHER_SESSION_COOKIE_NAME:-teacher_session}
      TEACHER_CSRF_COOKIE_NAME: ${TEACHER_CSRF_COOKIE_NAME:-teacher_csrf}
      PARENT_WEB_ORIGIN: https://${PARENT_HOST}
      PARENT_GOOGLE_CALLBACK_URL: https://${PARENT_HOST}/api/parent/auth/google/callback
      PARENT_OAUTH_REDIRECT_URLS: https://${PARENT_HOST}
      PARENT_OAUTH_DENIED_REDIRECT_URL: https://${PARENT_HOST}
      PARENT_SESSION_COOKIE_NAME: ${PARENT_SESSION_COOKIE_NAME:-parent_session}
      PARENT_CSRF_COOKIE_NAME: ${PARENT_CSRF_COOKIE_NAME:-parent_csrf}
      OPS_WEB_ORIGIN: https://${OPS_HOST}
      OPS_GOOGLE_CALLBACK_URL: https://${OPS_HOST}/api/ops/auth/google/callback
      OPS_OAUTH_REDIRECT_URLS: https://${OPS_HOST}
      OPS_OAUTH_DENIED_REDIRECT_URL: https://${OPS_HOST}
      OPS_SESSION_COOKIE_NAME: ${OPS_SESSION_COOKIE_NAME:-ops_session}
      OPS_CSRF_COOKIE_NAME: ${OPS_CSRF_COOKIE_NAME:-ops_csrf}
    ports: ['127.0.0.1:${API_PORT:-9004}:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(\"http\").get(\"http://127.0.0.1:3000/health\", r => process.exit(r.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  admin:
    build: { context: ../.., dockerfile: apps/web/Dockerfile, args: { VITE_API_URL: 'https://${APP_HOST:?APP_HOST is required}' } }
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:${APP_PORT:-9000}:80']
    depends_on: { api: { condition: service_healthy } }
    healthcheck: *portal-healthcheck
    restart: unless-stopped

  teacher:
    build: { context: ../.., dockerfile: deploy/compose/portal.Dockerfile, args: { APP: teacher-web, VITE_API_URL: 'https://${TEACHER_HOST:?TEACHER_HOST is required}' } }
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:${TEACHER_PORT:-9001}:80']
    depends_on: { api: { condition: service_healthy } }
    healthcheck: *portal-healthcheck
    restart: unless-stopped

  parent:
    build: { context: ../.., dockerfile: apps/parent-web/Dockerfile, args: { VITE_API_URL: 'https://${PARENT_HOST:?PARENT_HOST is required}' } }
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:${PARENT_PORT:-9002}:80']
    depends_on: { api: { condition: service_healthy } }
    healthcheck: *portal-healthcheck
    restart: unless-stopped

  ops:
    build: { context: ../.., dockerfile: deploy/compose/portal.Dockerfile, args: { APP: ops-web, VITE_API_URL: 'https://${OPS_HOST:?OPS_HOST is required}' } }
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:${OPS_PORT:-9003}:80']
    depends_on: { api: { condition: service_healthy } }
    healthcheck: *portal-healthcheck
    restart: unless-stopped

volumes:
  postgres-data:
